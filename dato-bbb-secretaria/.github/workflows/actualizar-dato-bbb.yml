name: Actualizar Dato BBB

on:
  schedule:
    - cron: '0 11 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Actualizar productos
        run: python dato-bbb-secretaria/scripts/actualizar_productos.py

      - name: Guardar cambios si existen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dato-bbb-secretaria/data/productos.json
          git diff --cached --quiet || git commit -m "Actualizar productos Dato BBB"
          git push
