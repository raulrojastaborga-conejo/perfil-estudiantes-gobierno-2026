name: Update Market Odds

on:
  workflow_dispatch:
  schedule:
    - cron: "20 */6 * * *"

permissions:
  contents: write

jobs:
  update-market-odds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Update odds from The Odds API
        env:
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
          THE_ODDS_SPORT_KEY: soccer_fifa_world_cup
          THE_ODDS_REGIONS: us,eu,uk
          THE_ODDS_MARKETS: h2h
          THE_ODDS_FORMAT: decimal
        run: python scripts/update_market_odds.py
      - name: Commit odds
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add centro-mundial-2026/data/market_odds.json centro-mundial-2026/data/market_odds_diagnostic.json
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Actualiza cuotas de mercado"
          git pull --rebase
          git push
