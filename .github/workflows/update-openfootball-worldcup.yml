name: Update OpenFootball World Cup Data

on:
  workflow_dispatch:
  schedule:
    - cron: "15 */12 * * *"

permissions:
  contents: write

jobs:
  update-openfootball-worldcup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Parse OpenFootball World Cup data
        run: python scripts/update_openfootball_worldcup.py

      - name: Commit and push OpenFootball data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add centro-mundial-2026/data/openfootball_*.json
          if git diff --cached --quiet; then
            echo "No OpenFootball changes to commit"
          else
            git commit -m "Actualiza datos OpenFootball Mundial 2026"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
