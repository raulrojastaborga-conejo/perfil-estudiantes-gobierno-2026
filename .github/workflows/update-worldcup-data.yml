name: Update World Cup Data

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

concurrency:
  group: update-worldcup-data
  cancel-in-progress: true

jobs:
  update-worldcup-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch API-Football data
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python scripts/update_worldcup_data.py

      - name: Commit and push generated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add centro-mundial-2026/data/api_*.json centro-mundial-2026/data/live_*.json
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
          else
            git commit -m "Actualiza datos API Mundial 2026"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
