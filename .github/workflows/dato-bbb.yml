name: Dato BBB

on:
  workflow_dispatch:
  schedule:
    - cron: '0 11 * * *'

permissions:
  contents: write

jobs:
  update-products:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python dato-bbb-secretaria/scripts/actualizar_productos_v2.py
      - run: python dato-bbb-secretaria/scripts/busqueda_ia_ofertas.py
      - run: |
          git config user.name bot
          git config user.email bot@example.com
          git add dato-bbb-secretaria/data
          git diff --cached --quiet || git commit -m update-dato-bbb
          git pull --rebase origin main
          git push
